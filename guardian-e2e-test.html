<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Guardian E2E Test | Lumen Destiny</title><link rel="stylesheet" href="/styles.css?v=20260812-5"><link rel="stylesheet" href="/fortune-ui.css?v=20260812-14"><link rel="stylesheet" href="/result-enhance.css?v=20260812-3"><style>.test-steps{display:grid;gap:12px}.test-step{padding:16px;border:1px solid rgba(0,0,0,.1);border-radius:14px;background:#fff}.test-step strong{display:block;margin-bottom:6px}.test-log{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace;font-size:.84rem;padding:14px;border-radius:12px;background:rgba(0,0,0,.04)}.test-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.test-toolbar label{min-width:220px;flex:1}.test-toolbar input,.test-toolbar select{width:100%}</style></head><body><main class="result-page"><section class="result-hero"><p class="section-label">INTERNAL E2E TEST</p><h1>Guardian 결제 전체 흐름 테스트</h1><p>샘플 주문 생성 → 정책 동의 기록 → Checkout 생성 → 가상 결제 Webhook → 발급 → 인증까지 실제 서버 경로로 확인합니다. TEST MODE에서만 사용하세요.</p></section><section class="result-panel"><div class="test-toolbar"><label><span>Internal secret</span><input id="e2eSecret" type="password" autocomplete="off" placeholder="LUMEN_INTERNAL_SECRET"></label><label><span>Guardian 등급</span><select id="e2eTier"><option value="basic">Basic · $5</option><option value="custom">Personal Wish · $10</option><option value="rare">Rare · $50</option><option value="legendary">Legendary · $100</option></select></label><button id="e2eRun" class="button primary" type="button">전체 성공 테스트 실행</button><button id="e2eFail" class="button secondary" type="button">결제 실패 테스트</button><a class="button secondary" href="/status.html">상태 페이지</a></div><p id="e2eMessage" class="result-disclaimer">실제 카드 결제는 발생하지 않습니다. 테스트 비밀값은 현재 탭의 sessionStorage에만 저장됩니다.</p></section><section class="result-panel"><h2>진행 상태</h2><div id="e2eSteps" class="test-steps"><article class="test-step"><strong>준비</strong><span>테스트를 실행해 주세요.</span></article></div></section><section class="result-panel"><h2>상세 로그</h2><pre id="e2eLog" class="test-log">아직 실행되지 않았습니다.</pre></section></main><script src="/guardian-e2e-test.js?v=20260812-1" defer></script></body></html>
