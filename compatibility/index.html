mpatibility-i18n.js?v=20260812-2" defer></script><script>document.getElementById('compatForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),q=new URLSearchParams();for(const[k,v]of f.entries())q.set(k,String(v).trim());q.set('lang',new URLSearchParams(location.search).get('lang')||localStorage.getItem('lumen-lang')||'ko');location.href='/compatibility-result/?'+q.toString()})</script></body></html>
