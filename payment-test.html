<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Payment Test | Lumen Destiny</title><link rel="stylesheet" href="/styles.css?v=20260812-5"><link rel="stylesheet" href="/fortune-ui.css?v=20260812-14"><link rel="stylesheet" href="/result-enhance.css?v=20260812-3"></head><body><main class="result-page"><section class="result-hero"><p class="section-label">INTERNAL SANDBOX</p><h1>Guardian 가상 결제 테스트</h1><p>실제 돈이 오가지 않는 내부 개발용 화면입니다. Production에서는 사용하지 않습니다.</p></section><section class="result-panel"><div class="deep-reading-grid"><article><span>Guardian ID</span><h3 id="tGuardian">—</h3></article><article><span>Checkout ID</span><h3 id="tCheckout">—</h3></article><article><span>결제금액</span><h3 id="tAmount">—</h3></article></div><label><span>Internal secret</span><input id="tSecret" type="password" autocomplete="off" placeholder="LUMEN_INTERNAL_SECRET"></label><div class="result-actions"><button class="button primary" id="tSuccess" type="button">가상 결제 성공</button><button class="button secondary" id="tFail" type="button">가상 결제 실패</button><button class="button secondary" id="tCancel" type="button">가상 결제 취소</button></div><p id="tMessage" class="result-disclaimer">테스트 모드와 내부 비밀값이 모두 필요합니다.</p></section></main><script>(()=>{const q=new URLSearchParams(location.search),id=q.get('guardianId')||'',checkout=q.get('checkoutId')||'',amount=q.get('amount')||'',currency=q.get('currency')||'USD',ret=q.get('returnUrl')||`/guardian-payment-result.html?id=${encodeURIComponent(id)}`,$=x=>document.getElementById(x),secret=$('tSecret'),msg=$('tMessage');$('tGuardian').textContent=id||'—';$('tCheckout').textContent=checkout||'—';$('tAmount').textContent=amount?`${amount} ${currency}`:'—';const saved=sessionStorage.getItem('lumen-internal-secret')||'';if(saved)secret.value=saved;async function run(mode,btn){const key=secret.value.trim();if(!key){msg.textContent='Internal secret을 입력해 주세요.';return}sessionStorage.setItem('lumen-internal-secret',key);btn.disabled=true;msg.textContent='가상 결제 이벤트 처리 중…';try{const r=await fetch('/api/payments/test-complete',{method:'POST',headers:{'content-type':'application/json','x-lumen-internal-secret':key},body:JSON.stringify({guardianId:id,mode})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||`HTTP ${r.status}`);msg.textContent=`처리 완료: ${d.event}`;setTimeout(()=>location.assign(ret),500)}catch(e){msg.textContent=`처리 실패: ${e.message||e}`;btn.disabled=false}}$('tSuccess').onclick=e=>run('success',e.currentTarget);$('tFail').onclick=e=>run('failed',e.currentTarget);$('tCancel').onclick=e=>run('cancelled',e.currentTarget)})();</script></body></html>
