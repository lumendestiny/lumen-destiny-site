name: LumenDestiny
options:
  bundleIdPrefix: com.lumendestiny
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
targets:
  LumenDestiny:
    type: application
    platform: iOS
    sources:
      - path: LumenDestiny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumendestiny.app
        PRODUCT_NAME: Lumen Destiny
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumen Destiny
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
