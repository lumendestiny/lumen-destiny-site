name: App V1 Check

on:
  push:
    branches: [app-v1]
    paths:
      - 'app/**'
      - '.github/workflows/app-v1-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-v1-check.yml'

jobs:
  android-bundle-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo doctor
        run: npx expo-doctor

      - name: Android JS bundle export
        run: npx expo export --platform android --output-dir dist-android
