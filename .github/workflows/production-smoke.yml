name: Production Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for production deployment
        run: sleep 20
      - name: Check production pages and API
        env:
          LUMEN_PROD_BASE_URL: https://lumendestiny.com
        run: node scripts/production-smoke.mjs
