name: Android V1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/android-v1-apk
    paths:
      - 'android/**'
      - '.github/workflows/android-v1-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-v1-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lumen-Destiny-V1-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Destiny-V1-Test-APK
          path: Lumen-Destiny-V1-Test.apk
          if-no-files-found: error
          retention-days: 14
