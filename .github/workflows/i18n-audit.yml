name: i18n-audit

on:
  push:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - 'scripts/i18n-audit.mjs'
      - '.github/workflows/i18n-audit.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'

jobs:
  hardcoded-korean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit unexpected hardcoded Korean (advisory)
        env:
          LUMEN_I18N_STRICT: 'false'
        run: node scripts/i18n-audit.mjs
