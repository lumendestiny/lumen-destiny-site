name: App V1 Connection Map Visual Sync

on:
  push:
    branches: [app-v1]
    paths:
      - '.github/workflows/app-v1-connection-map-visual-sync.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Upgrade connection map visuals
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/app/connection-map.tsx')
          s=p.read_text()
          def repl(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              s=s.replace(old,new,1)

          repl(
          "const label:Record<string,string>={목:'성장 · 확장',화:'표현 · 추진',토:'안정 · 조율',금:'결단 · 질서',수:'유연 · 통찰'};",
          "const label:Record<string,string>={목:'성장 · 확장',화:'표현 · 추진',토:'안정 · 조율',금:'결단 · 질서',수:'유연 · 통찰'};\nconst relationVisual:Record<RelationGroup,{symbol:string;fill:string;border:string;soft:string}>={\n partner:{symbol:'♥',fill:'#e75d9a',border:'#f1b6d3',soft:'#fff7fb'},\n family:{symbol:'●',fill:'#7d62db',border:'#c7b9ff',soft:'#faf8ff'},\n friend:{symbol:'✦',fill:'#5f8fd9',border:'#9dbdf5',soft:'#f7fbff'},\n work:{symbol:'◆',fill:'#52aaa8',border:'#9fd9d8',soft:'#f5fdfd'},\n other:{symbol:'◎',fill:'#d99a40',border:'#edc27c',soft:'#fffaf1'},\n};",
          'relation visual palette')

          repl(
          "return <><View style={[styles.mapBoard,compact&&styles.mapBoardCompact,tiny&&styles.mapBoardTiny]}>{visible.map",
          "return <><View style={[styles.mapBoard,compact&&styles.mapBoardCompact,tiny&&styles.mapBoardTiny]}><View pointerEvents=\"none\" style={[styles.orbit,styles.orbitOuter,compact&&styles.orbitOuterCompact,tiny&&styles.orbitOuterTiny]}/><View pointerEvents=\"none\" style={[styles.orbit,styles.orbitMiddle,compact&&styles.orbitMiddleCompact,tiny&&styles.orbitMiddleTiny]}/><View pointerEvents=\"none\" style={[styles.orbit,styles.orbitInner,compact&&styles.orbitInnerCompact,tiny&&styles.orbitInnerTiny]}/>{visible.map",
          'map orbit layers')

          repl(
          "<View style={[styles.meNode,compact&&styles.meNodeCompact,tiny&&styles.meNodeTiny]}><Text numberOfLines=\"1\" ellipsizeMode=\"tail\" style={[styles.meNodeName,compact&&styles.meNodeNameCompact,tiny&&styles.meNodeNameTiny]}",
          "<View style={[styles.meNode,compact&&styles.meNodeCompact,tiny&&styles.meNodeTiny]}><View style={styles.meAvatar}><Text style={styles.meAvatarText}>●</Text></View><Text numberOfLines=\"1\" ellipsizeMode=\"tail\" style={[styles.meNodeName,compact&&styles.meNodeNameCompact,tiny&&styles.meNodeNameTiny]}",
          'central avatar')

          old="{visible.map((m,i)=>{const s=activeSlots[i],active=selectedId===m.id;return <Pressable key={m.id} onPress={()=>setSelectedId(active?null:m.id)} style={[styles.personNode,compact&&styles.personNodeCompact,tiny&&styles.personNodeTiny,{left:(s.node as any).left,right:(s.node as any).right,top:s.node.top},active&&styles.personNodeActive]}><Text numberOfLines=\"1\" ellipsizeMode=\"tail\" style={[styles.nodeName,compact&&styles.nodeNameCompact,tiny&&styles.nodeNameTiny]}>{m.name}</Text>"
          new="{visible.map((m,i)=>{const s=activeSlots[i],active=selectedId===m.id,group=memberRelationGroup(m),visual=relationVisual[group];return <Pressable key={m.id} onPress={()=>setSelectedId(active?null:m.id)} accessibilityRole=\"button\" accessibilityState={{selected:active}} accessibilityLabel={`${m.name}, ${m.relation}, 보완도 ${m.score}, 상세 보기`} style={[styles.personNode,compact&&styles.personNodeCompact,tiny&&styles.personNodeTiny,{left:(s.node as any).left,right:(s.node as any).right,top:s.node.top,borderColor:visual.border,backgroundColor:active?visual.soft:'#fff'},active&&styles.personNodeActive]}><View style={[styles.nodeIcon,{backgroundColor:visual.fill}]}><Text style={styles.nodeIconText}>{visual.symbol}</Text></View><Text numberOfLines=\"1\" ellipsizeMode=\"tail\" style={[styles.nodeName,compact&&styles.nodeNameCompact,tiny&&styles.nodeNameTiny]}>{m.name}</Text>"
          repl(old,new,'relation-aware nodes')

          repl(
          "<Text style={styles.nodeScore}>{m.score}</Text></Pressable>",
          "<View style={[styles.nodeScoreBadge,{backgroundColor:visual.fill}]}><Text style={styles.nodeScore}>{m.score}</Text></View></Pressable>",
          'score badge')

          repl(
          "return <Pressable key={option.id} onPress={()=>{setActiveGroup(option.id);setEditingGroupId(null);}} style={[styles.filterChip,active&&styles.filterChipActive,tiny&&styles.filterChipTiny]}",
          "return <Pressable key={option.id} onPress={()=>{setActiveGroup(option.id);setEditingGroupId(null);}} accessibilityRole=\"button\" accessibilityState={{selected:active}} accessibilityLabel={`${option.label} 인연 ${groupCounts[option.id]}명`} style={[styles.filterChip,active&&styles.filterChipActive,tiny&&styles.filterChipTiny]}",
          'filter accessibility')

          repl(
          "mapBoard:{height:370,marginTop:14,borderRadius:22,backgroundColor:'#f8f7ff',overflow:'hidden',position:'relative'},\n mapBoardCompact:{height:330,borderRadius:18},\n mapBoardTiny:{height:324},",
          "mapBoard:{height:390,marginTop:14,borderRadius:24,backgroundColor:'#fbfaff',borderWidth:1,borderColor:'#ece8ff',overflow:'hidden',position:'relative'},\n mapBoardCompact:{height:350,borderRadius:20},\n mapBoardTiny:{height:330},\n orbit:{position:'absolute',left:'50%',top:'50%',borderWidth:1,borderColor:'#e4dfff',borderRadius:999,zIndex:0},\n orbitOuter:{width:300,height:300,marginLeft:-150,marginTop:-150,opacity:.55},\n orbitOuterCompact:{width:250,height:250,marginLeft:-125,marginTop:-125},\n orbitOuterTiny:{width:214,height:214,marginLeft:-107,marginTop:-107},\n orbitMiddle:{width:220,height:220,marginLeft:-110,marginTop:-110,opacity:.68},\n orbitMiddleCompact:{width:188,height:188,marginLeft:-94,marginTop:-94},\n orbitMiddleTiny:{width:162,height:162,marginLeft:-81,marginTop:-81},\n orbitInner:{width:142,height:142,marginLeft:-71,marginTop:-71,borderColor:'#d7cfff',opacity:.9},\n orbitInnerCompact:{width:122,height:122,marginLeft:-61,marginTop:-61},\n orbitInnerTiny:{width:106,height:106,marginLeft:-53,marginTop:-53},",
          'map board and rings')

          repl(
          "connector:{position:'absolute',height:2,backgroundColor:'#cdc8f7'},",
          "connector:{position:'absolute',height:2,backgroundColor:'#cfc7fa',zIndex:1,opacity:.88},",
          'connector')

          repl(
          "meNode:{position:'absolute',left:'50%',top:132,marginLeft:-45,width:90,height:90,borderRadius:45,backgroundColor:'#1f2330',alignItems:'center',justifyContent:'center',zIndex:3,padding:8},\n meNodeCompact:{top:124,marginLeft:-36,width:72,height:72,borderRadius:36,padding:6},\n meNodeTiny:{top:121,marginLeft:-32,width:64,height:64,borderRadius:32,padding:5},",
          "meNode:{position:'absolute',left:'50%',top:143,marginLeft:-50,width:100,height:100,borderRadius:50,backgroundColor:'#6d55dc',borderWidth:3,borderColor:'#eeeaff',alignItems:'center',justifyContent:'center',zIndex:4,padding:8,shadowColor:'#4f3bc5',shadowOpacity:.24,shadowRadius:18,shadowOffset:{width:0,height:10},elevation:9},\n meNodeCompact:{top:132,marginLeft:-42,width:84,height:84,borderRadius:42,padding:6},\n meNodeTiny:{top:126,marginLeft:-36,width:72,height:72,borderRadius:36,padding:5},\n meAvatar:{width:22,height:22,borderRadius:11,backgroundColor:'#fff',alignItems:'center',justifyContent:'center',marginBottom:4},\n meAvatarText:{fontSize:11,color:'#6d55dc',fontWeight:'900'},",
          'premium center node')

          repl(
          "personNode:{position:'absolute',width:98,minHeight:72,borderRadius:18,backgroundColor:'#fff',borderWidth:1,borderColor:'#dedbef',alignItems:'center',justifyContent:'center',paddingHorizontal:8,paddingVertical:8,zIndex:2},\n personNodeCompact:{width:80,minHeight:66,borderRadius:16,paddingHorizontal:6,paddingVertical:6},\n personNodeTiny:{width:70,minHeight:62,borderRadius:15,paddingHorizontal:5,paddingVertical:5},\n personNodeActive:{borderColor:'#5146c8',borderWidth:2,backgroundColor:'#f1efff'},",
          "personNode:{position:'absolute',width:94,height:94,borderRadius:47,backgroundColor:'#fff',borderWidth:2,borderColor:'#dedbef',alignItems:'center',justifyContent:'center',paddingHorizontal:7,paddingVertical:7,zIndex:3,shadowColor:'#312b55',shadowOpacity:.09,shadowRadius:10,shadowOffset:{width:0,height:6},elevation:3},\n personNodeCompact:{width:78,height:78,borderRadius:39,paddingHorizontal:5,paddingVertical:5},\n personNodeTiny:{width:68,height:68,borderRadius:34,paddingHorizontal:4,paddingVertical:4},\n personNodeActive:{borderWidth:3,transform:[{scale:1.04}],shadowOpacity:.16,elevation:5},\n nodeIcon:{width:21,height:21,borderRadius:11,alignItems:'center',justifyContent:'center',marginBottom:2},\n nodeIconText:{fontSize:10,fontWeight:'900',color:'#fff'},",
          'premium person nodes')

          repl(
          "nodeScore:{marginTop:4,fontSize:12,fontWeight:'900',color:'#5146c8'},",
          "nodeScoreBadge:{minWidth:30,height:19,marginTop:3,paddingHorizontal:6,borderRadius:10,alignItems:'center',justifyContent:'center'},\n nodeScore:{fontSize:10,fontWeight:'900',color:'#fff'},",
          'node score pill')

          repl(
          "nodeDetail:{marginTop:12,padding:16,borderRadius:16,backgroundColor:'#f6f4ff',borderWidth:1,borderColor:'#e0dcff'},",
          "nodeDetail:{marginTop:14,padding:17,borderRadius:20,backgroundColor:'#fbf9ff',borderWidth:1,borderColor:'#e4dfff',shadowColor:'#3f327a',shadowOpacity:.06,shadowRadius:14,shadowOffset:{width:0,height:8},elevation:2},",
          'selected detail card')

          repl(
          "rankRow:{marginTop:10,flexDirection:'row',alignItems:'center',gap:10,padding:12,borderRadius:14,backgroundColor:'#fff'},",
          "rankRow:{marginTop:10,flexDirection:'row',alignItems:'center',gap:10,padding:12,borderRadius:14,backgroundColor:'#fff',borderWidth:1,borderColor:'#ece8fa'},",
          'ranking rows')

          p.write_text(s)
          print('patched',p)

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Expo doctor
        working-directory: app
        run: npx expo-doctor
      - name: Android JS bundle export
        working-directory: app
        run: npx expo export --platform android --output-dir dist-visual-check
      - name: Commit visual update
        run: |
          git config user.name lumendestiny
          git config user.email llumendestiny@gmail.com
          git add app/src/app/connection-map.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Polish app relationship map visual network"
          git push origin HEAD:app-v1
