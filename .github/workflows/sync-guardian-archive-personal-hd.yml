name: Sync Guardian Archive Personal HD

on:
  push:
    paths:
      - '.github/workflows/sync-guardian-archive-personal-hd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install pillow gdown
      - name: Download approved Personal masters from Lumen Drive
        run: |
          mkdir -p /tmp/guardian-personal assets/guardian/archive-hd
          gdown 'https://drive.google.com/uc?id=1Jka3GCCg6pK_ANCBOSou2RJw0RYuwwQ2' -O /tmp/guardian-personal/moon-rabbit.png
          gdown 'https://drive.google.com/uc?id=1F9QhnX15YN5ID_f7cLc5f4eKgD9JEg_4' -O /tmp/guardian-personal/dolphin.png
          gdown 'https://drive.google.com/uc?id=1Zjz9GJE7_aJOThT3jB21N9icUhwY2Wg-' -O /tmp/guardian-personal/fire-fox.png
          gdown 'https://drive.google.com/uc?id=1VSoKhFcgPFTUpk1GMxYFmhzornOAdlM7' -O /tmp/guardian-personal/leaf-turtle.png
          gdown 'https://drive.google.com/uc?id=1oaWYUXuiiqIyTABeLu_MfhHmHj9S0cax' -O /tmp/guardian-personal/star-owl.png
      - name: Verify and create square archive HD masters
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          items = {
              'moon-rabbit.png': 'guardian-personal-moon-rabbit-hd.webp',
              'dolphin.png': 'guardian-personal-dolphin-hd.webp',
              'fire-fox.png': 'guardian-personal-fire-fox-hd.webp',
              'leaf-turtle.png': 'guardian-personal-leaf-turtle-hd.webp',
              'star-owl.png': 'guardian-personal-star-owl-hd.webp',
          }
          src = Path('/tmp/guardian-personal')
          dst = Path('assets/guardian/archive-hd')
          dst.mkdir(parents=True, exist_ok=True)

          for inp, out in items.items():
              p = src / inp
              if not p.exists() or p.stat().st_size < 2_000_000:
                  raise RuntimeError(f'{inp}: source master missing or unexpectedly small')
              with Image.open(p) as check:
                  check.verify()
              with Image.open(p) as im:
                  im = im.convert('RGB')
                  if im.width < 1200 or im.height < 1200:
                      raise RuntimeError(f'{inp}: source resolution too small: {im.size}')
                  im = im.resize((2400, 2400), Image.Resampling.LANCZOS)
                  im = im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=80, threshold=3))
                  q = dst / out
                  im.save(q, 'WEBP', quality=94, method=6)
              with Image.open(q) as verify:
                  verify.verify()
              if q.stat().st_size < 300_000:
                  raise RuntimeError(f'{out}: converted archive asset unexpectedly small: {q.stat().st_size}')
              print(out, q.stat().st_size)
          PY
      - name: Enable Personal HD masters in archive
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path('guardian-archive-hd-manifest.js')
          manifest.write_text("""window.LUMEN_GUARDIAN_ARCHIVE_HD = Object.freeze({
            version: '2026-08-15-hd20-personal-live-1',
            basePath: '/assets/guardian/archive-hd/',
            items: {
              'fortune-cat': 'guardian-basic-fortune-cat-hd.webp',
              'koi': 'guardian-basic-koi-hd.webp',
              'sun-bird': 'guardian-basic-sun-bird-hd.webp',
              'new-deer': 'guardian-basic-new-deer-hd.webp',
              'gold-hamster': 'guardian-basic-gold-hamster-hd.webp',
              'moon-rabbit': 'guardian-personal-moon-rabbit-hd.webp',
              'dolphin': 'guardian-personal-dolphin-hd.webp',
              'fire-fox': 'guardian-personal-fire-fox-hd.webp',
              'leaf-turtle': 'guardian-personal-leaf-turtle-hd.webp',
              'star-owl': 'guardian-personal-star-owl-hd.webp',
              'nine-fox': null,
              'sea-dragon': null,
              'unicorn': null,
              'forest-turtle': null,
              'wing-owl': null,
              'sky-dragon': null,
              'fire-phoenix': null,
              'moon-tiger': null,
              'qilin': null,
              'black-turtle': null
            }
          });
          """, encoding='utf-8')

          collection = Path('guardian-collection-v2.js')
          text = collection.read_text(encoding='utf-8')
          text = text.replace("['moon-rabbit','월토끼'", "['moon-rabbit','달토끼'")
          text = text.replace("['dolphin','청돌고래'", "['dolphin','소망돌고래'")
          text = text.replace("['leaf-turtle','숲거북'", "['leaf-turtle','잎새거북'")
          collection.write_text(text, encoding='utf-8')

          page = Path('guardian/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('20260814-hd20-basic-live-1', '20260815-hd20-personal-live-1')
          page.write_text(html, encoding='utf-8')
          PY
      - name: Commit approved Personal archive assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/guardian/archive-hd/guardian-personal-*-hd.webp guardian-archive-hd-manifest.js guardian-collection-v2.js guardian/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Add approved Personal Guardian archive HD artwork'
          git pull --rebase origin main
          git push origin main
