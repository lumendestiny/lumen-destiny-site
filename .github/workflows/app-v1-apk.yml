name: App V1 Standalone APK

on:
  push:
    branches: [app-v1]
    paths:
      - 'app/**'
      - '.github/workflows/app-v1-apk.yml'
  workflow_dispatch:

jobs:
  build-standalone-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo doctor
        run: npx expo-doctor

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Bundle JavaScript for standalone APK
        run: npx expo export:embed --platform android --dev false --entry-file node_modules/expo-router/entry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Verify embedded bundle
        run: test -s android/app/src/main/assets/index.android.bundle && ls -lh android/app/src/main/assets/index.android.bundle

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-destiny-app-v1-standalone-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
