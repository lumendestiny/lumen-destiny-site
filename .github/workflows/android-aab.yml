name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-aab.yml'
      - 'scripts/android-prepare.mjs'
      - 'connection-map-visual-v2.js'
      - 'connection-map/**'
      - 'guardian/**'
      - 'assets/guardian/**'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Prepare bundled web assets
        run: npm run android:prepare
      - name: Create Android project
        run: npx cap add android
      - name: Target Android 16 / API 36 and set V10 version
        shell: bash
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 36/' android/variables.gradle
            sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 36/' android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/versionCode [0-9]+/versionCode 10/' android/app/build.gradle
            sed -i -E 's/versionName "[^"]+"/versionName "1.0.9"/' android/app/build.gradle
          fi
          grep -nE 'applicationId|versionCode|versionName' android/app/build.gradle
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build release app bundle
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Verify signing secrets exist
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
      - name: Decode upload keystore
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
      - name: Sign AAB with upload key
        shell: bash
        run: |
          jarsigner -keystore android/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-destiny-release-aab-v10
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
