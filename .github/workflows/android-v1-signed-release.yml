name: Android V1 Signed Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing ANDROID_UPLOAD_KEYSTORE_BASE64' && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo 'Missing ANDROID_UPLOAD_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing ANDROID_UPLOAD_KEY_ALIAS' && exit 1)
          test -n "$KEY_PASSWORD" || (echo 'Missing ANDROID_UPLOAD_KEY_PASSWORD' && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lumen-upload.jks"

      - name: Build signed release AAB
        working-directory: android-release
        env:
          LUMEN_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lumen-upload.jks
          LUMEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify AAB signature
        run: jarsigner -verify -strict android-release/app/build/outputs/bundle/release/app-release.aab

      - name: Rename signed AAB
        run: cp android-release/app/build/outputs/bundle/release/app-release.aab Lumen-Destiny-V1-Play-Upload.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Destiny-V1-Play-Upload-AAB
          path: Lumen-Destiny-V1-Play-Upload.aab
          if-no-files-found: error
          retention-days: 14
