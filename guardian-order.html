eading-grid"><label>보내는 사람<input id="guardianGiver" maxlength="30" placeholder="예: 엄마, 민수 선배"></label><label>받는 사람<input id="guardianRecipient" maxlength="30" placeholder="예: 지민" required></label><label>시험·목표 날짜<input id="guardianTargetDate" type="date"></label><label>캠페인<input id="guardianCampaign" readonly></label></div></div><label>Guardian에 표시할 이름 또는 닉네임<input id="guardianName" name="name" maxlength="30" required></label><label>담고 싶은 소망<textarea id="guardianWish" name="wish" rows="5" maxlength="300" placeholder="예: 준비한 만큼 차분하게 실력을 발휘하길 응원합니다." required></textarea></label><label>선물 메시지 (선택)<textarea id="guardianMessage" name="message" rows="3" maxlength="200" placeholder="예: 결과보다 네가 여기까지 노력한 시간이 더 자랑스러워. 끝까지 응원할게."></textarea></label><button class="fortune-submit" type="submit">발급 정보 미리보기</button></form><p class="result-disclaimer">※ Guardian은 응원과 소망을 담는 상징적 디지털 콘텐츠이며 합격·취업·승진 등 특정 결과를 보장하지 않습니다.</p></section><section id="guardianPreview" class="result-panel" hidden><div class="panel-heading"><div><p class="section-label">ISSUANCE PREVIEW</p><h2>Guardian 발급 정보</h2></div><span id="guardianRarity" class="engine-badge"></span></div><div id="guardianPreviewBody" class="deep-reading-grid"></div><div class="result-actions"><button id="guardianConfirm" class="button primary" type="button">이 내용으로 발급 준비</button><a class="button secondary" href="/guardian.html">아카이브로 돌아가기</a></div><p id="guardianConfirmNote" class="result-disclaimer" hidden></p></section></main><script src="/service-shell.js?v=20260812-2" defer></script><script src="/runtime-config.js?v=20260812-1" defer></script><script src="/lumen-api.js?v=20260812-2" defer></script><script src="/guardian-order.js?v=20260812-4" defer></script></body></html>
